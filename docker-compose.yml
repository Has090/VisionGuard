version: "3.8"

services:
  # Service 1: PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: visionguard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Persistent named volume as required
      - db_data:/var/lib/postgresql/data
    expose:
      # Internal port only - NO port published to the outside host
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - visionguard_internal_net

  # Service 2: Web Serving Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: visionguard:v1
    container_name: visionguard_web
    restart: unless-stopped
    ports:
      # Web port published to host
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      # Model file mounted dynamically at runtime
      - ./app/model:/app/app/model:ro
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - visionguard_internal_net

volumes:
  db_data:
    name: visionguard_db_data

networks:
  visionguard_internal_net:
    driver: bridge